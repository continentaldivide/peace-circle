<!--
  The sign-in email for an address Supabase has never seen — usually someone
  arriving with a launch code. Supabase calls it "Confirm signup", and sends it
  instead of magic-link.html only when email confirmations are on, as they are
  on the hosted project. Locally they are off, so to see this one, turn on
  `enable_confirmations` under [auth.email] and restart.

  The link is deliberately identical to magic-link.html's; see that file for
  why it points at this site and why it begins with .RedirectTo.

  THE HOSTED PROJECT NEEDS THE SAME LINK. Edit the "Confirm signup" template
  in the Supabase dashboard by hand to match.
-->
<h2>Welcome to the Peace Circle</h2>

<p>
  Follow the link below to confirm this is your email address and we&rsquo;ll
  finish setting you up. There is no password to choose.
</p>

<p>
  <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email"
    >Step into the circle</a
  >
</p>

<p>
  The link works once and is good for one hour. If you didn&rsquo;t ask for it,
  you can ignore this email and nothing happens.
</p>
